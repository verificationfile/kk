<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Logo Prompt Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --success-color: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 30px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            color: #60a5fa;
            font-size: 24px;
            margin-bottom: 25px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: #cbd5e1;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .output-section {
            margin-top: 25px;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 15px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #38bdf8;
            font-family: monospace;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }

        .btn-container {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        .copied-msg {
            color: var(--success-color);
            font-size: 14px;
            margin-right: 15px;
            display: none;
            align-items: center;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Professional Logo Prompt Generator</h2>
        
        <div class="input-group">
            <label for="englishName">Company Name in English (Optional):</label>
            <input type="text" id="englishName" placeholder="e.g. Al-Noor Global" oninput="generatePrompt()">
        </div>

        <div class="input-group">
            <label for="arabicName">Company Name in Arabic (Optional):</label>
            <input type="text" id="arabicName" placeholder="e.g. النور العالمية" oninput="generatePrompt()">
        </div>

        <div class="output-section">
            <label for="outputPrompt">Generated Professional Prompt:</label>
            <textarea id="outputPrompt" readonly></textarea>
            
            <div class="btn-container">
                <span id="copiedMsg" class="copied-msg">Copied Successfully!</span>
                <button onclick="copyPrompt()">Copy Prompt</button>
            </div>
        </div>
    </div>

    <script>
        function generatePrompt() {
            const englishName = document.getElementById('englishName').value.trim();
            const arabicName = document.getElementById('arabicName').value.trim();

            let textInstruction = "";
            if (englishName && arabicName) {
                textInstruction = `featuring the company name clearly written as "${englishName}" (and secondary Arabic text "${arabicName}") in a clean, modern, highly legible corporate typography`;
            } else if (englishName) {
                textInstruction = `featuring the company name clearly written as "${englishName}" in a clean, modern, highly legible corporate typography`;
            } else if (arabicName) {
                textInstruction = `featuring the company name clearly written in Arabic calligraphy/typography as "${arabicName}" in a clean, modern, highly legible corporate style`;
            } else {
                textInstruction = `clean abstract minimalist corporate icon design without any specific text`;
            }

            const prompt = `A top-tier, world-class professional corporate logo design, vector art style, sleek modern aesthetics, balanced composition, ${textInstruction}. Premium branding concept, high-end visual identity, minimalist geometry, striking color palette with sharp contrast, solid clean background, ultra-detailed vector paths, graphic design masterpiece, award-winning branding, 8k resolution, photorealistic presentation, sharp focus, masterpiece --ar 1:1 --v 6.0`;

            document.getElementById('outputPrompt').value = prompt;
        }

        function copyPrompt() {
            const textarea = document.getElementById('outputPrompt');
            textarea.select();
            textarea.setSelectionRange(0, 99999); // For mobile devices
            
            navigator.clipboard.writeText(textarea.value).then(() => {
                const msg = document.getElementById('copiedMsg');
                msg.style.display = 'inline-flex';
                setTimeout(() => {
                    msg.style.display = 'none';
                }, 2000);
            });
        }

        // Initialize on load
        generatePrompt();
    </script>

</body>
</html>
